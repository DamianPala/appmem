name: CI

on:
  push:
    branches: [main, feat/platform-backends]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.runner_label }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.12"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.13"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.14"
          - os: macos-15
            runner_label: macOS 15 ARM64
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q
        env:
          TERM: xterm

      - name: Signal shutdown diagnostic (five runs)
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            printf 'SIGTERM attempt %s\n' "$attempt"
            uv run pytest -q -s tests/test_cli_signals.py
          done
        env:
          TERM: xterm

  darwin-native-probe:
    name: Darwin native probe (macOS 15 ARM64)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Native probe
        run: uv run python scripts/darwin_probe.py --output darwin-probe.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-native-probe
          path: darwin-probe.json
          if-no-files-found: ignore
          retention-days: 14
