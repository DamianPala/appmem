name: CI

on:
  push:
    branches: [main, feat/platform-backends]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.runner_label }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.12"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.13"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.14"
          - os: macos-15
            runner_label: macOS 15 ARM64
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q
        env:
          TERM: xterm
