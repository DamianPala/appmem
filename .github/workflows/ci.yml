name: CI

on:
  push:
    branches: [main, feat/platform-backends]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.runner_label }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.12"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.13"
          - os: ubuntu-latest
            runner_label: Ubuntu
            python-version: "3.14"
          - os: macos-15
            runner_label: macOS 15 ARM64
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q
        env:
          TERM: xterm

  darwin-native-probe:
    name: Darwin native probe (macOS 15 ARM64)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python 3.14

      - name: Native probe
        run: uv run python scripts/darwin_probe.py --output darwin-probe.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-native-probe
          path: darwin-probe.json
          if-no-files-found: ignore
          retention-days: 14

  darwin-installed-wheel:
    name: Darwin installed wheel (Python ${{ matrix.python-version }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install matrix Python
        run: uv python install ${{ matrix.python-version }}

      - name: Installed wheel acceptance
        run: >-
          python3 scripts/darwin_integration.py
          --python ${{ matrix.python-version }}
          --output darwin-integration-${{ matrix.python-version }}.json
        env:
          TERM: xterm

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-installed-wheel-${{ matrix.python-version }}
          path: darwin-integration-${{ matrix.python-version }}.json
          if-no-files-found: ignore
          retention-days: 14
